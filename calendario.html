<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificador 2026 — Calendario</title>
  <style>

:root {
  --rosa-principal: #F8C8DC;
  --rosa-oscuro: #E8A4C8;
  --rosa-claro: #FFF0F5;
  --rosa-medio: #FADADD;
  --texto: #5A3A44;
  --texto-claro: #8B6B75;
  --blanco: #FFFFFF;
  --crema: #FDF6F0;
  --sombra: rgba(90, 58, 68, 0.08);
  --borde: #F0D0D8;
  --exito: #A8D5BA;
  --alerta: #F5C6AA;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  background: var(--crema);
  color: var(--texto);
  min-height: 100vh;
  line-height: 1.6;
}
.nav-bar {
  background: var(--blanco);
  border-bottom: 1px solid var(--borde);
  padding: 0 2rem;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 20px var(--sombra);
}
.nav-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
}
.nav-logo {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--rosa-oscuro);
  letter-spacing: 1px;
}
.nav-links {
  display: flex;
  gap: 0.5rem;
  list-style: none;
}
.nav-links a {
  text-decoration: none;
  color: var(--texto-claro);
  font-size: 0.9rem;
  font-weight: 500;
  padding: 0.5rem 1rem;
  border-radius: 20px;
  transition: all 0.3s ease;
}
.nav-links a:hover, .nav-links a.active {
  background: var(--rosa-claro);
  color: var(--rosa-oscuro);
}
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 2rem;
}
.card {
  background: var(--blanco);
  border-radius: 20px;
  padding: 1.5rem;
  box-shadow: 0 4px 24px var(--sombra);
  border: 1px solid var(--borde);
  margin-bottom: 1.5rem;
  transition: transform 0.2s ease;
}
.card:hover { transform: translateY(-2px); }
.card-title {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--rosa-oscuro);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.btn {
  background: var(--rosa-principal);
  color: var(--texto);
  border: none;
  padding: 0.6rem 1.4rem;
  border-radius: 12px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  font-family: inherit;
}
.btn:hover {
  background: var(--rosa-oscuro);
  color: var(--blanco);
  transform: translateY(-1px);
}
.btn-outline {
  background: transparent;
  border: 2px solid var(--rosa-principal);
  color: var(--rosa-oscuro);
}
.btn-outline:hover {
  background: var(--rosa-principal);
  color: var(--texto);
}
.btn-small {
  padding: 0.3rem 0.8rem;
  font-size: 0.8rem;
  border-radius: 8px;
}
input, textarea, select {
  font-family: inherit;
  border: 1px solid var(--borde);
  border-radius: 10px;
  padding: 0.6rem 0.9rem;
  font-size: 0.9rem;
  color: var(--texto);
  background: var(--crema);
  outline: none;
  transition: border-color 0.3s ease;
  width: 100%;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--rosa-oscuro);
  background: var(--blanco);
}
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
@media (max-width: 768px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .nav-links { display: none; }
  .container { padding: 1rem; }
}
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--crema); }
::-webkit-scrollbar-thumb { background: var(--rosa-principal); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--rosa-oscuro); }

    .cal-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .cal-header h1 {
      font-size: 2rem;
      font-weight: 300;
      color: var(--texto);
    }
    .cal-header h1 span { font-weight: 700; color: var(--rosa-oscuro); }

    .mes-selector {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .mes-btn {
      background: var(--blanco);
      border: 1px solid var(--borde);
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--texto-claro);
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .mes-btn:hover, .mes-btn.active {
      background: var(--rosa-principal);
      color: var(--texto);
      border-color: var(--rosa-oscuro);
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.5rem;
    }
    .cal-dia-header {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--rosa-oscuro);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 0.5rem;
    }
    .cal-dia {
      background: var(--blanco);
      border: 1px solid var(--borde);
      border-radius: 12px;
      min-height: 90px;
      padding: 0.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }
    .cal-dia:hover {
      border-color: var(--rosa-oscuro);
      box-shadow: 0 2px 12px var(--sombra);
    }
    .cal-dia .num {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--texto);
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .cal-dia.hoy .num {
      background: var(--rosa-principal);
      color: var(--texto);
    }
    .cal-dia.otro-mes {
      opacity: 0.3;
    }
    .cal-dia .nota-preview {
      font-size: 0.7rem;
      color: var(--texto-claro);
      margin-top: 0.3rem;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .cal-dia .dot {
      width: 6px;
      height: 6px;
      background: var(--rosa-oscuro);
      border-radius: 50%;
      display: inline-block;
      margin-right: 2px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(90,58,68,0.3);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--blanco);
      border-radius: 24px;
      padding: 2rem;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(90,58,68,0.2);
      border: 1px solid var(--borde);
    }
    .modal h3 {
      color: var(--rosa-oscuro);
      margin-bottom: 1rem;
      font-size: 1.2rem;
    }
    .modal textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      margin-bottom: 1rem;
    }
    .modal-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
    }

    @media (max-width: 768px) {
      .cal-dia { min-height: 60px; padding: 0.3rem; }
      .cal-dia .nota-preview { display: none; }
    }
  </style>
</head>
<body>

    <nav class="nav-bar">
    <div class="nav-inner">
      <div class="nav-logo">&#10047; Planificador 2026</div>
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="calendario.html" class="active">Calendario</a></li>
        <li><a href="habitos.html">Hábitos</a></li>
        <li><a href="tiempo.html">Mi Día</a></li>
        <li><a href="finanzas.html">Finanzas</a></li>
        <li><a href="notas.html">Notas</a></li>
        <li><a href="personalizar.html">&#127912;</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="cal-header">
      <h1>Calendario <span>2026</span></h1>
    </div>

    <div class="mes-selector" id="mesSelector"></div>

    <div class="card">
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 id="modalTitle">Nota del día</h3>
      <textarea id="modalText" placeholder="Escribe aquí tu nota, cita o recordatorio..."></textarea>
      <div class="modal-actions">
        <button class="btn btn-outline btn-small" onclick="cerrarModal()">Cancelar</button>
        <button class="btn btn-small" onclick="guardarNota()">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    const diasSemana = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    let mesActual = new Date().getMonth();
    let diaSeleccionado = null;

    function getNotas() {
      return JSON.parse(localStorage.getItem('cal_notas_2026') || '{}');
    }
    function setNotas(notas) {
      localStorage.setItem('cal_notas_2026', JSON.stringify(notas));
    }

    function renderMesSelector() {
      const cont = document.getElementById('mesSelector');
      cont.innerHTML = '';
      meses.forEach((m, i) => {
        const btn = document.createElement('button');
        btn.className = 'mes-btn' + (i === mesActual ? ' active' : '');
        btn.textContent = m;
        btn.onclick = () => { mesActual = i; renderCalendario(); renderMesSelector(); };
        cont.appendChild(btn);
      });
    }

    function renderCalendario() {
      const grid = document.getElementById('calGrid');
      grid.innerHTML = '';
      const notas = getNotas();

      diasSemana.forEach(d => {
        const el = document.createElement('div');
        el.className = 'cal-dia-header';
        el.textContent = d;
        grid.appendChild(el);
      });

      const primerDia = new Date(2026, mesActual, 1).getDay();
      const diasEnMes = new Date(2026, mesActual + 1, 0).getDate();
      const diasMesAnterior = new Date(2026, mesActual, 0).getDate();

      for (let i = primerDia - 1; i >= 0; i--) {
        const el = document.createElement('div');
        el.className = 'cal-dia otro-mes';
        el.innerHTML = `<div class="num">${diasMesAnterior - i}</div>`;
        grid.appendChild(el);
      }

      const hoy = new Date();
      for (let d = 1; d <= diasEnMes; d++) {
        const el = document.createElement('div');
        const esHoy = hoy.getFullYear() === 2026 && hoy.getMonth() === mesActual && hoy.getDate() === d;
        el.className = 'cal-dia' + (esHoy ? ' hoy' : '');
        const key = `2026-${String(mesActual+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const nota = notas[key];
        let html = `<div class="num">${d}</div>`;
        if (nota) {
          html += `<div class="nota-preview"><span class="dot"></span>${nota.substring(0,30)}${nota.length>30?'...':''}</div>`;
        }
        el.innerHTML = html;
        el.onclick = () => abrirModal(d);
        grid.appendChild(el);
      }

      const totalCeldas = primerDia + diasEnMes;
      const restantes = (7 - (totalCeldas % 7)) % 7;
      for (let i = 1; i <= restantes; i++) {
        const el = document.createElement('div');
        el.className = 'cal-dia otro-mes';
        el.innerHTML = `<div class="num">${i}</div>`;
        grid.appendChild(el);
      }
    }

    function abrirModal(dia) {
      diaSeleccionado = dia;
      const key = `2026-${String(mesActual+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
      const notas = getNotas();
      document.getElementById('modalTitle').textContent = `${dia} de ${meses[mesActual]} de 2026`;
      document.getElementById('modalText').value = notas[key] || '';
      document.getElementById('modal').classList.add('open');
    }

    function cerrarModal() {
      document.getElementById('modal').classList.remove('open');
      diaSeleccionado = null;
    }

    function guardarNota() {
      if (diaSeleccionado === null) return;
      const key = `2026-${String(mesActual+1).padStart(2,'0')}-${String(diaSeleccionado).padStart(2,'0')}`;
      const notas = getNotas();
      const texto = document.getElementById('modalText').value.trim();
      if (texto) notas[key] = texto;
      else delete notas[key];
      setNotas(notas);
      cerrarModal();
      renderCalendario();
    }

    document.getElementById('modal').addEventListener('click', e => {
      if (e.target === document.getElementById('modal')) cerrarModal();
    });

    renderMesSelector();
    renderCalendario();
  </script>


  <script>
    const temaGuardado = localStorage.getItem('tema_planificador');
    if (temaGuardado) {
      const t = JSON.parse(temaGuardado);
      const r = document.documentElement;
      r.style.setProperty('--rosa-principal', t.principal);
      r.style.setProperty('--rosa-oscuro', t.oscuro);
      r.style.setProperty('--rosa-claro', t.claro);
      r.style.setProperty('--rosa-medio', t.medio);
      r.style.setProperty('--texto', t.texto);
      r.style.setProperty('--texto-claro', t.textoClaro);
      r.style.setProperty('--crema', t.crema);
      r.style.setProperty('--borde', t.borde);
      r.style.setProperty('--sombra', t.sombra);
      r.style.setProperty('--acento', t.acento);
    }
  </script>
</body>
</html>
