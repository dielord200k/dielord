<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificador 2026 — Notas</title>
  <style>

:root {
  --rosa-principal: #F8C8DC;
  --rosa-oscuro: #E8A4C8;
  --rosa-claro: #FFF0F5;
  --rosa-medio: #FADADD;
  --texto: #5A3A44;
  --texto-claro: #8B6B75;
  --blanco: #FFFFFF;
  --crema: #FDF6F0;
  --sombra: rgba(90, 58, 68, 0.08);
  --borde: #F0D0D8;
  --exito: #A8D5BA;
  --alerta: #F5C6AA;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  background: var(--crema);
  color: var(--texto);
  min-height: 100vh;
  line-height: 1.6;
}
.nav-bar {
  background: var(--blanco);
  border-bottom: 1px solid var(--borde);
  padding: 0 2rem;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 20px var(--sombra);
}
.nav-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
}
.nav-logo {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--rosa-oscuro);
  letter-spacing: 1px;
}
.nav-links {
  display: flex;
  gap: 0.5rem;
  list-style: none;
}
.nav-links a {
  text-decoration: none;
  color: var(--texto-claro);
  font-size: 0.9rem;
  font-weight: 500;
  padding: 0.5rem 1rem;
  border-radius: 20px;
  transition: all 0.3s ease;
}
.nav-links a:hover, .nav-links a.active {
  background: var(--rosa-claro);
  color: var(--rosa-oscuro);
}
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 2rem;
}
.card {
  background: var(--blanco);
  border-radius: 20px;
  padding: 1.5rem;
  box-shadow: 0 4px 24px var(--sombra);
  border: 1px solid var(--borde);
  margin-bottom: 1.5rem;
  transition: transform 0.2s ease;
}
.card:hover { transform: translateY(-2px); }
.card-title {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--rosa-oscuro);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.btn {
  background: var(--rosa-principal);
  color: var(--texto);
  border: none;
  padding: 0.6rem 1.4rem;
  border-radius: 12px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  font-family: inherit;
}
.btn:hover {
  background: var(--rosa-oscuro);
  color: var(--blanco);
  transform: translateY(-1px);
}
.btn-outline {
  background: transparent;
  border: 2px solid var(--rosa-principal);
  color: var(--rosa-oscuro);
}
.btn-outline:hover {
  background: var(--rosa-principal);
  color: var(--texto);
}
.btn-small {
  padding: 0.3rem 0.8rem;
  font-size: 0.8rem;
  border-radius: 8px;
}
input, textarea, select {
  font-family: inherit;
  border: 1px solid var(--borde);
  border-radius: 10px;
  padding: 0.6rem 0.9rem;
  font-size: 0.9rem;
  color: var(--texto);
  background: var(--crema);
  outline: none;
  transition: border-color 0.3s ease;
  width: 100%;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--rosa-oscuro);
  background: var(--blanco);
}
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
@media (max-width: 768px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .nav-links { display: none; }
  .container { padding: 1rem; }
}
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--crema); }
::-webkit-scrollbar-thumb { background: var(--rosa-principal); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--rosa-oscuro); }

    .notas-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .notas-header h1 {
      font-size: 2rem;
      font-weight: 300;
      color: var(--texto);
    }
    .notas-header h1 span { font-weight: 700; color: var(--rosa-oscuro); }

    .notas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .nota-card {
      background: var(--blanco);
      border-radius: 20px;
      padding: 1.2rem;
      border: 1px solid var(--borde);
      box-shadow: 0 4px 20px var(--sombra);
      transition: all 0.3s ease;
      position: relative;
    }
    .nota-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 30px var(--sombra);
    }
    .nota-card .nota-fecha {
      font-size: 0.7rem;
      color: var(--texto-claro);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }
    .nota-card .nota-titulo {
      font-weight: 600;
      color: var(--rosa-oscuro);
      margin-bottom: 0.5rem;
      font-size: 1.05rem;
    }
    .nota-card .nota-texto {
      color: var(--texto);
      font-size: 0.9rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .nota-card .nota-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      justify-content: flex-end;
    }
    .nota-card .nota-color {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      border-radius: 20px 20px 0 0;
    }

    .nota-new {
      background: var(--rosa-claro);
      border: 2px dashed var(--rosa-principal);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .nota-new:hover {
      background: var(--rosa-medio);
      border-color: var(--rosa-oscuro);
    }
    .nota-new .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .nota-new p { color: var(--rosa-oscuro); font-weight: 600; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(90,58,68,0.3);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--blanco);
      border-radius: 24px;
      padding: 2rem;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 20px 60px rgba(90,58,68,0.2);
      border: 1px solid var(--borde);
    }
    .modal h3 {
      color: var(--rosa-oscuro);
      margin-bottom: 1rem;
    }
    .modal input, .modal textarea {
      margin-bottom: 0.8rem;
    }
    .modal textarea {
      min-height: 140px;
      resize: vertical;
    }
    .color-picker {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .color-opt {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      transition: all 0.2s;
    }
    .color-opt.selected { border-color: var(--texto); transform: scale(1.1); }

    .search-box {
      margin-bottom: 1.5rem;
    }
    .search-box input {
      max-width: 400px;
    }
  </style>
</head>
<body>

    <nav class="nav-bar">
    <div class="nav-inner">
      <div class="nav-logo">&#10047; Planificador 2026</div>
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="calendario.html">Calendario</a></li>
        <li><a href="habitos.html">Hábitos</a></li>
        <li><a href="tiempo.html">Mi Día</a></li>
        <li><a href="finanzas.html">Finanzas</a></li>
        <li><a href="notas.html" class="active">Notas</a></li>
        <li><a href="personalizar.html">&#127912;</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="notas-header">
      <h1>Mis <span>Notas</span></h1>
    </div>

    <div class="search-box">
      <input type="text" id="searchNotas" placeholder="&#128269; Buscar en tus notas..." oninput="renderNotas()">
    </div>

    <div class="notas-grid" id="notasGrid">
      <div class="nota-card nota-new" onclick="abrirModal()">
        <span class="icon">&#10133;</span>
        <p>Nueva nota</p>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 id="modalTitle">Nueva nota</h3>
      <input type="text" id="notaTitulo" placeholder="Título de la nota">
      <textarea id="notaTexto" placeholder="Escribe aquí..."></textarea>
      <div class="color-picker" id="colorPicker"></div>
      <div class="modal-actions">
        <button class="btn btn-outline btn-small" onclick="cerrarModal()">Cancelar</button>
        <button class="btn btn-small" onclick="guardarNota()">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    const NOTAS_KEY = 'notas_2026';
    const colores = ['#F8C8DC', '#FADADD', '#A8D5BA', '#F5C6AA', '#B8A9C9', '#FDF6F0'];
    let notaEditando = null;
    let colorSeleccionado = colores[0];

    function getNotas() {
      return JSON.parse(localStorage.getItem(NOTAS_KEY) || '[]');
    }
    function setNotas(n) {
      localStorage.setItem(NOTAS_KEY, JSON.stringify(n));
    }

    function renderColorPicker() {
      const cont = document.getElementById('colorPicker');
      cont.innerHTML = '';
      colores.forEach(c => {
        const div = document.createElement('div');
        div.className = 'color-opt' + (c === colorSeleccionado ? ' selected' : '');
        div.style.background = c;
        div.onclick = () => { colorSeleccionado = c; renderColorPicker(); };
        cont.appendChild(div);
      });
    }

    function abrirModal(id = null) {
      notaEditando = id;
      const notas = getNotas();
      const nota = id ? notas.find(n => n.id === id) : null;
      document.getElementById('modalTitle').textContent = id ? 'Editar nota' : 'Nueva nota';
      document.getElementById('notaTitulo').value = nota ? nota.titulo : '';
      document.getElementById('notaTexto').value = nota ? nota.texto : '';
      colorSeleccionado = nota ? nota.color : colores[0];
      renderColorPicker();
      document.getElementById('modal').classList.add('open');
    }

    function cerrarModal() {
      document.getElementById('modal').classList.remove('open');
      notaEditando = null;
    }

    function guardarNota() {
      const titulo = document.getElementById('notaTitulo').value.trim();
      const texto = document.getElementById('notaTexto').value.trim();
      if (!titulo && !texto) return;
      const notas = getNotas();
      if (notaEditando) {
        const idx = notas.findIndex(n => n.id === notaEditando);
        if (idx >= 0) {
          notas[idx] = { id: notaEditando, titulo, texto, color: colorSeleccionado, fecha: notas[idx].fecha };
        }
      } else {
        notas.push({ id: Date.now(), titulo, texto, color: colorSeleccionado, fecha: new Date().toISOString() });
      }
      setNotas(notas);
      cerrarModal();
      renderNotas();
    }

    function eliminarNota(id) {
      if (!confirm('&#191;Eliminar esta nota?')) return;
      let notas = getNotas();
      notas = notas.filter(n => n.id !== id);
      setNotas(notas);
      renderNotas();
    }

    function renderNotas() {
      const busqueda = document.getElementById('searchNotas').value.toLowerCase();
      const notas = getNotas().sort((a,b) => b.id - a.id);
      const filtradas = notas.filter(n =>
        n.titulo.toLowerCase().includes(busqueda) ||
        n.texto.toLowerCase().includes(busqueda)
      );
      const grid = document.getElementById('notasGrid');
      grid.innerHTML = `
        <div class="nota-card nota-new" onclick="abrirModal()">
          <span class="icon">&#10133;</span>
          <p>Nueva nota</p>
        </div>
      `;

      filtradas.forEach(n => {
        const card = document.createElement('div');
        card.className = 'nota-card';
        card.innerHTML = `
          <div class="nota-color" style="background:${n.color}"></div>
          <div class="nota-fecha">${new Date(n.fecha).toLocaleDateString('es-AR')}</div>
          <div class="nota-titulo">${n.titulo || 'Sin título'}</div>
          <div class="nota-texto">${n.texto}</div>
          <div class="nota-actions">
            <button class="btn btn-small btn-outline" onclick="abrirModal(${n.id})">Editar</button>
            <button class="btn btn-small btn-outline" onclick="eliminarNota(${n.id})">Eliminar</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    document.getElementById('modal').addEventListener('click', e => {
      if (e.target === document.getElementById('modal')) cerrarModal();
    });

    renderNotas();
  </script>


  <script>
    const temaGuardado = localStorage.getItem('tema_planificador');
    if (temaGuardado) {
      const t = JSON.parse(temaGuardado);
      const r = document.documentElement;
      r.style.setProperty('--rosa-principal', t.principal);
      r.style.setProperty('--rosa-oscuro', t.oscuro);
      r.style.setProperty('--rosa-claro', t.claro);
      r.style.setProperty('--rosa-medio', t.medio);
      r.style.setProperty('--texto', t.texto);
      r.style.setProperty('--texto-claro', t.textoClaro);
      r.style.setProperty('--crema', t.crema);
      r.style.setProperty('--borde', t.borde);
      r.style.setProperty('--sombra', t.sombra);
      r.style.setProperty('--acento', t.acento);
    }
  </script>
</body>
</html>
